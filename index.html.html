const ren=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(ren.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x779977,.85));

const mat=c=>new THREE.MeshLambertMaterial({color:c});
let world=new THREE.Group();scene.add(world);
function box(w,h,d,c,x,y,z,p){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);(p||world).add(m);return m}
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const sunBall=new THREE.Mesh(new THREE.SphereGeometry(10,16,16),new THREE.MeshBasicMaterial({color:0xfff176,fog:false}));sunBall.position.set(120,150,80);scene.add(sunBall);
const clouds=[];for(let i=0;i<12;i++){const g=new THREE.Group();for(let j=0;j<3;j++)box(8+rnd()*6,3,5+rnd()*4,0xffffff,j*5,rnd()*1.5,rnd()*3,g);g.position.set((rnd()-.5)*300,45+rnd()*25,(rnd()-.5)*300-80);scene.add(g);clouds.push(g)}

function nbParse(src){
  const tk=[],re=/(\s+)|(\/\/[^\n]*)|(\d+(?:\.\d+)?)|([A-Za-z_\u0600-\u06FF][\w\u0600-\u06FF]*)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|(\+\+|--|\+=|-=|\*=|\/=|==|!=|<=|>=|&&|\|\||[-+*\/%<>=!(){}\[\];,.])/y;

    if(m[1])line+=(m[1].match(/\n/g)||[]).length;else if(m[2]){}else if(m[3])tk.push({t:'n',v:+m[3],l:line});else if(m[4])tk.push({t:'i',v:m[4],l:line});
    else if(m[5])tk.push({t:'s',v:m[5].slice(1,-1).replace(/\\(.)/g,(a,c)=>c==='n'?'\n':c),l:line});else tk.push({t:'p',v:m[6],l:line})}

    if(ac('let')){const n=id();let e=null;if(ac('='))e=expr();ac(';');return{k:'let',n,e}}

      let c=null;if(!isP(';'))c=expr();ex(';');let s=null;if(!isP(')'))s=expr();ex(')');return{k:'for',i:ini,c,s,b:stmt()}}
    if(ac('return')){let e=null;if(!isP(';')&&!isP('}'))e=expr();ac(';');return{k:'ret',e}}
    const e=expr();ac(';');return{k:'ex',e}}
  function expr(){const l=orx();if(isP('=')||isP('+=')||isP('-=')||isP('*=')||isP('/=')){const op=tk[p++].v;if(l.k!=='id'&&l.k!=='idx')er('لا يمكن الإسناد هنا');return{k:'as',op,t:l,e:expr()}}return l}
  function orx(){let a=andx();while(isP('||')){p++;a={k:'lg',op:'||',a,b:andx()}}return a}
  function andx(){let a=eqx();while(isP('&&')){p++;a={k:'lg',op:'&&',a,b:eqx()}}return a}
  function eqx(){let a=rel();while(isP('==')||isP('!=')){const op=tk[p++].v;a={k:'bin',op,a,b:rel()}}return a}
  function rel(){let a=add();while(isP('<')||isP('>')||isP('<=')||isP('>=')){const op=tk[p++].v;a={k:'bin',op,a,b:add()}}return a}
  function add(){let a=mul();while(isP('+')||isP('-')){const op=tk[p++].v;a={k:'bin',op,a,b:mul()}}return a}
  function mul(){let a=un();while(isP('*')||isP('/')||isP('%')){const op=tk[p++].v;a={k:'bin',op,a,b:un()}}return a}

    const dx=rx*ix+fx*-iz,dz=rz*ix+fz*-iz;player.position.x+=dx*SP;player.position.z+=dz*SP;

  else if(sl){player.position.x+=Math.sin(player.rotation.y)*SP;player.position.z+=Math.cos(player.rotation.y)*SP}
  if(G.walls)pushOut(player.position);
  vy-=.014;player.position.y+=vy;
  const f=floorAt(player.position.x,player.position.z,player.position.y-vy);
  if(vy<=0&&player.position.y<=f.h){player.position.y=f.h;vy=0;onGround=true;if(play)landed(f.p)}else if(f.h<player.position.y-.1)onGround=false;
  if(player.position.y<-25)respawn();
  if(play&&curMap===2&&Math.random()<.1)hud();
  animate(P,moving,onGround,walkT);
  if(moving)G.em=0;else if(G.em>0){G.em--;if(G.ek===1){armR.rotation.x=0;armR.rotation.z=2.5+Math.sin(frame*.3)*.35}else{const q=Math.sin(frame*.4);armL.rotation.x=-2.4*(q>0?1:.1);armR.rotation.x=-2.4*(q>0?.1:1);legL.rotation.x=q*.6;legR.rotation.x=-q*.6;player.rotation.y+=.12}}
  if(G.stab>0)armR.rotation.x=-1.8;
  if(G.slide>0){G.slide--;if(G.slide===0)G.scd=70;legL.rotation.x=legR.rotation.x=-1.3;armL.rotation.x=armR.rotation.x=1.2;if(!(G.frz>0))player.rotation.x=-.7;if(frame%3===0)burst(player.position.x,.2,player.position.z,1,0xbdbdbd)}
  else{if(G.scd>0)G.scd--;if(!(G.frz>0)&&player.rotation.x!==0)player.rotation.x=0}
  if(!play){armR.rotation.x=0;armR.rotation.z=2.5+Math.sin(frame*.2)*.3}
  if(G.frz>0&&--G.frz===0){player.rotation.x=0;if(G.after)G.after()}
  if(play){const mp=MAPS[curMap];if(mp.tick)mp.tick();if(frame%90===0)lbCheck();fxTick();if(G.pets&&G.pets.length)petsTick()}
  if(play)stars.forEach(s=>{if(!s.visible)return;s.rotation.y+=.03;if(s.position.distanceTo(new THREE.Vector3(player.position.x,player.position.y+1.5,player.position.z))<1.9){s.visible=false;starN++;hud();if(starN>=6)mission()}});
  if(bubble&&--bubT<=0){player.remove(bubble);bubble=null}
  clouds.forEach(c=>{c.position.x+=.01;if(c.position.x>170)c.position.x=-170});
  if(!play){player.rotation.y+=.012;pitch=.12}
  const dist=play?15:10.5,cx=player.position.x,cy=player.position.y+(play?2.5:2.1),cz=player.position.z,ya=play?yaw:0;
  cam.position.set(cx+Math.sin(ya)*Math.cos(pitch)*dist,cy+Math.sin(pitch)*dist,cz+Math.cos(ya)*Math.cos(pitch)*dist);cam.lookAt(cx,cy,cz);
  if(G.cam&&play){cam.position.set(G.cam.p[0],G.cam.p[1],G.cam.p[2]);cam.lookAt(G.cam.l[0],G.cam.l[1],G.cam.l[2])}
  ren.render(scene,cam)}

const rc=new THREE.Raycaster(),v2=new THREE.Vector2(),PLN=new THREE.Plane(new THREE.Vector3(0,1,0),0),hv3=new THREE.Vector3(),ptr=new Map();let pd=null,lastPinch=0;
const setRay=(x,y)=>{v2.set(x/innerWidth*2-1,-(y/innerHeight)*2+1);rc.setFromCamera(v2,cam)};
const pickPart=(x,y)=>{setRay(x,y);const h=rc.intersectObjects(E.m);return h.length?E.m.indexOf(h[0].object):-1};
const planeHit=(x,y,py)=>{setRay(x,y);PLN.constant=-py;return rc.ray.intersectPlane(PLN,hv3)?hv3:null};
